# Prometheus scrape config for zstrategy.
#
# Target hostnames assume the docker-compose service names. If you run the
# backend on the host instead, replace with `host.docker.internal:8080`.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zstrategy-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
